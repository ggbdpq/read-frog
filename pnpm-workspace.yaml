minimumReleaseAge: 0

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  # ponytail: registry metadata lacks a publish time for this version, so the
  # no-downgrade trust check cannot verify it; it is the project's own package.
  - "@read-frog/layout-engine@0.3.0"
  - react-redux@9.2.0
  - reselect@5.1.1
  - semver@6.3.1
  - why-is-node-running@3.2.2

allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  nx: true
  spawn-sync: true
